<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 120" width="1200" height="120" role="img" aria-label="Tornus: geometric modelling kernel for CAD, written in Rust">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a35"/>
      <stop offset="100%" stop-color="#0b1020"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="lathe-glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="120" rx="12" fill="url(#bg)"/>

  <!-- Lathe turning geometry: rotational CAD kernel profile & turned contours -->
  <g fill="none" stroke-linecap="round">
    <line x1="680" y1="60" x2="1160" y2="60" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="6 6" opacity="0.35"/>
    <path d="M700 60 C 760 30, 830 90, 890 60 S 980 30, 1050 75 S 1120 45, 1150 60"
          stroke="url(#lathe-glow)" stroke-width="14"/>
    <path d="M700 60 C 760 30, 830 90, 890 60 S 980 30, 1050 75 S 1120 45, 1150 60"
          stroke="url(#accent)" stroke-width="2.5" opacity="0.95"/>
    <path d="M700 35 C 760 18, 830 50, 890 35 S 980 18, 1050 38 S 1120 25, 1150 35"
          stroke="#06b6d4" stroke-width="1.6" stroke-dasharray="6 8" opacity="0.55"/>
    <path d="M700 85 C 760 102, 830 70, 890 85 S 980 102, 1050 82 S 1120 95, 1150 85"
          stroke="#8b5cf6" stroke-width="1.6" stroke-dasharray="6 8" opacity="0.55"/>
    <ellipse cx="780" cy="60" rx="12" ry="28" stroke="#06b6d4" stroke-width="1.5" opacity="0.75"/>
    <ellipse cx="890" cy="60" rx="10" ry="25" stroke="#3b82f6" stroke-width="1.5" opacity="0.8"/>
    <ellipse cx="990" cy="60" rx="15" ry="36" stroke="#8b5cf6" stroke-width="1.5" opacity="0.75"/>
    <ellipse cx="1090" cy="60" rx="12" ry="26" stroke="#06b6d4" stroke-width="1.5" opacity="0.7"/>
  </g>

  <text x="44" y="74" font-family="ui-sans-serif,Segoe UI,Helvetica,Arial,sans-serif"
        font-size="64" font-weight="700" fill="#e2e8f0" letter-spacing="-1">Tornus</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="15" fill="#94a3b8">
    <text x="310" y="52">geometric modelling kernel · CAD</text>
    <text x="310" y="76">bounded geometry · meshing · solver slice</text>
  </g>
</svg>
