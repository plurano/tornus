---
# The documentation site of the workspace, published to GitHub Pages by
# .github/workflows/pages.yml. It publishes the pages under docs/ and nothing
# else; the README stays the front page on the forge. Build from the
# repository root:
#
#   python -m mkdocs build --strict

site_name: Tornus
site_url: https://plurano.github.io/tornus/
site_description: >-
  Geometric modelling kernel for CAD, written in Rust: a correct modelling
  core checked against a public conformance corpus.
site_author: Lusoris
repo_url: https://github.com/plurano/tornus
repo_name: plurano/tornus
edit_uri: blob/main/docs/
copyright: Copyright &copy; 2026 Lusoris, EUPL-1.2

docs_dir: docs
site_dir: site

# Build inputs that are not pages: the pinned requirements of this build.
exclude_docs: |
  requirements.in
  requirements.txt

validation:
  omitted_files: warn
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

theme:
  name: material
  language: en
  palette:
    - scheme: slate
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - scheme: default
      primary: indigo
      accent: cyan
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.action.edit
    - content.code.copy
    - toc.follow

plugins:
  - search

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plurano/tornus
      name: Tornus on GitHub

nav:
  - Home: index.md
  - The geometry crate: geometry.md
  - Decision records:
      - Index: adr/README.md
      - Template: adr/0000-template.md
